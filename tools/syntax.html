<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax Highlighter Tool</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- highlight.js for syntax highlighting -->
    <!-- You can change the theme by changing atom-one-dark.min.css to another theme name -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- Add specific languages for more accurate highlighting if needed -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>

    <style>
        /* Custom styles for a better look and feel */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Make the textareas and code blocks fill their container */
        .pane-content {
            width: 100%;
            height: 100%;
            /* UPDATED: Added border and new background color */
            border: 1px solid #4a5568; /* border-gray-600 */
            background-color: #2d3748; /* bg-gray-700 */
            color: #d1d5db; /* text-gray-300 */
            /* Using a standard monospace font stack to avoid ligatures */
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875rem;
            resize: none;
            padding: 1rem;
            border-radius: 0.5rem;
            box-sizing: border-box;
            outline: none; /* Remove default focus outline */
        }
        .pane-content:focus {
             border-color: #4299e1; /* border-blue-400 on focus */
        }
        /* Style for the preview panes which now contain pre/code blocks */
        .preview-pane-container {
            background-color: #1f2937; /* Match the code editor background */
            flex-grow: 1; /* Make it fill the space */
            border-radius: 0.5rem;
            overflow: auto;
            padding: 1rem;
        }
        .preview-pane-container pre, .preview-pane-container code {
             white-space: pre-wrap; /* Allow code to wrap */
             background: none; /* Ensure no background from hljs theme overrides container */
             padding: 0;
        }
        /* Simple transition for the copy confirmation message */
        #copy-confirmation {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-200">

    <div class="container mx-auto p-4 max-w-7xl">
        <!-- Header Section -->
        <header class="mb-6 text-center">
            <h1 class="text-4xl font-bold text-white">Live Syntax Highlighter</h1>
            <p class="text-gray-400 mt-2">Paste your code to see it raw and highlighted in real-time.</p>
        </header>

        <!-- Controls Section -->
        <div class="flex justify-center items-center mb-6 bg-gray-800 p-4 rounded-lg shadow-lg">
            <label for="language-select" class="mr-3 font-medium text-white">Language:</label>
            <select id="language-select" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5">
                <option value="auto">Auto-detect</option>
                <option value="xml">HTML/XML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="sql">SQL</option>
                <option value="json">JSON</option>
                <option value="bash">Bash/Shell</option>
            </select>
            <div class="ml-6 text-sm">
                <span class="text-gray-400">Detected Language:</span>
                <span id="detected-language" class="font-bold text-cyan-400">N/A</span>
            </div>
        </div>

        <!-- Main 4-Pane Layout -->
        <main class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[70vh]">
            
            <!-- Left Column -->
            <div class="grid grid-rows-2 gap-6">
                <!-- Pane 1: Raw Code Input -->
                <div class="flex flex-col bg-gray-800 rounded-lg shadow-md p-4">
                    <h2 class="text-lg font-semibold mb-2 text-white">1. Raw Code Input</h2>
                    <textarea id="raw-input" class="pane-content" spellcheck="false">#include <stdio.h>

int main(int argc, char** argv) {
    printf("Hello, World!\n");
}
</textarea>
                </div>

                <!-- Pane 2: Raw Code Preview -->
                <div class="flex flex-col bg-gray-800 rounded-lg shadow-md p-4">
                    <h2 class="text-lg font-semibold mb-2 text-white">2. Raw Code Preview</h2>
                    <div class="preview-pane-container">
                        <pre><code id="raw-preview-code"></code></pre>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="grid grid-rows-2 gap-6">
                <!-- Pane 3: Highlighted HTML Output -->
                <div class="flex flex-col bg-gray-800 rounded-lg shadow-md p-4">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-lg font-semibold text-white">3. Highlighted HTML Output</h2>
                        <div>
                            <span id="copy-confirmation" class="text-green-400 mr-3 opacity-0">Copied!</span>
                            <button id="copy-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded-lg text-sm">Copy HTML</button>
                        </div>
                    </div>
                    <textarea id="highlighted-output" class="pane-content" readonly></textarea>
                </div>

                <!-- Pane 4: Highlighted Code Preview -->
                <div class="flex flex-col bg-gray-800 rounded-lg shadow-md p-4">
                    <h2 class="text-lg font-semibold mb-2 text-white">4. Highlighted Code Preview</h2>
                    <div class="preview-pane-container">
                        <pre><code id="highlighted-preview" class="hljs"></code></pre>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Get references to all the DOM elements
        const rawInput = document.getElementById('raw-input');
        const rawPreviewCode = document.getElementById('raw-preview-code');
        const highlightedOutput = document.getElementById('highlighted-output');
        const highlightedPreview = document.getElementById('highlighted-preview');
        const languageSelect = document.getElementById('language-select');
        const detectedLanguageEl = document.getElementById('detected-language');
        const copyButton = document.getElementById('copy-button');
        const copyConfirmation = document.getElementById('copy-confirmation');

        /**
         * The main function to update all panes based on the raw input.
         */
        function updatePanes() {
            const code = rawInput.value;

            // 1. Update the Raw Code Preview (Pane 2)
            rawPreviewCode.textContent = code;

            // 2. Perform syntax highlighting with highlight.js
            let highlightResult;
            const selectedLanguage = languageSelect.value;

            if (selectedLanguage === 'auto') {
                highlightResult = hljs.highlightAuto(code);
            } else {
                if (hljs.getLanguage(selectedLanguage)) {
                    highlightResult = hljs.highlight(code, { language: selectedLanguage });
                } else {
                    highlightResult = hljs.highlightAuto(code);
                    console.warn(`Language '${selectedLanguage}' not registered. Falling back to auto-detect.`);
                }
            }
            
            const highlightedCode = highlightResult.value;
            const detectedLang = highlightResult.language || 'none';

            // 3. Update the Highlighted HTML Output (Pane 3)
            highlightedOutput.value = highlightedCode;

            // 4. Update the Highlighted Code Preview (Pane 4)
            highlightedPreview.innerHTML = highlightedCode;
            
            // 5. Update the detected language display
            detectedLanguageEl.textContent = detectedLang.charAt(0).toUpperCase() + detectedLang.slice(1);
        }

        /**
         * Copies the content of the highlighted output to the clipboard.
         */
        function copyHighlightedHtml() {
            navigator.clipboard.writeText(highlightedOutput.value).then(() => {
                copyConfirmation.classList.remove('opacity-0');
                setTimeout(() => {
                    copyConfirmation.classList.add('opacity-0');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                highlightedOutput.select();
                document.execCommand('copy');
            });
        }
        
        /**
         * NEW: Handles the Tab key press in the raw input textarea.
         */
        function handleTabKey(event) {
            if (event.key === 'Tab') {
                event.preventDefault(); // Prevent focus from changing
                
                const start = this.selectionStart;
                const end = this.selectionEnd;
                const tabCharacter = '  '; // Using two spaces for the tab

                // Set the new value by inserting the tab character
                this.value = this.value.substring(0, start) + tabCharacter + this.value.substring(end);

                // Move the cursor to after the inserted tab
                this.selectionStart = this.selectionEnd = start + tabCharacter.length;
            }
        }

        // --- Event Listeners ---
        rawInput.addEventListener('input', updatePanes);
        rawInput.addEventListener('keydown', handleTabKey); // NEW: Listener for tab trapping
        languageSelect.addEventListener('change', updatePanes);
        copyButton.addEventListener('click', copyHighlightedHtml);

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', updatePanes);
    </script>
</body>
</html>
