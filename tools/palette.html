<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Viewer</title>
    <style>
        /* --- Basic Setup & Theming --- */
        :root {
            --bg: #141415;
            --fg: #cdcdcd;
            --textarea-bg: #252530;
            --border: #606079;
            --accent: #aeaed1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* --- UI Elements --- */
        #color-input {
            width: 100%;
            height: 250px;
            background-color: var(--textarea-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            box-sizing: border-box;
        }

        #color-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
        }
        
        /* --- Palette Display --- */
        #palette {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .swatch {
            width: 100px;
            height: 100px;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
        }
        
        .swatch:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <textarea id="color-input"></textarea>

    <div id="palette"></div>

    <script>
        const inputArea = document.getElementById('color-input');
        const paletteContainer = document.getElementById('palette');
        const tempStyleChecker = document.createElement('div').style;

        // --- Default colors from your notes ---
        const defaultColors = `
            bg = 141415
            orange = e0a363
            purple bg = 606079
            purple fg = aeaed1
            normal fg cdcdcd
            blue 6e94b2
            light blue b4d4cf
            error d8647e
            nice red c48282
            bar fg maybe 252530
        `;

        /**
         * Checks if a string is a valid CSS color.
         * @param {string} str The string to test.
         * @returns {string|null} The valid color string or null.
         */
        function getValidColor(str) {
            // Reset the style property
            tempStyleChecker.color = '';
            // Assign the new value
            tempStyleChecker.color = str;
            // If the browser could parse it, the value will not be an empty string
            return tempStyleChecker.color === '' ? null : tempStyleChecker.color;
        }

        /**
         * Forgivingly parses a line of text to find a color code within it.
         * It checks words from right to left.
         * @param {string} line - A single line of text from the input.
         * @returns {string|null} The found color or null.
         */
        function parseColorFromLine(line) {
            if (!line.trim()) return null;

            const parts = line.trim().split(/[\s=,]+/);
            for (let i = parts.length - 1; i >= 0; i--) {
                let potentialColor = parts[i];
                // Handle hex codes that are missing the '#' prefix
                if (/^[0-9a-fA-F]{3}$|^[0-9a-fA-F]{6}$/.test(potentialColor)) {
                    potentialColor = '#' + potentialColor;
                }
                
                const validColor = getValidColor(potentialColor);
                if (validColor) {
                    return validColor;
                }
            }
            return null;
        }

        /**
         * Clears and redraws the entire color palette based on the textarea content.
         */
        function updatePalette() {
            // Clear the existing palette
            paletteContainer.innerHTML = '';
            
            const lines = inputArea.value.split('\n');
            const fragment = document.createDocumentFragment();

            lines.forEach(line => {
                const color = parseColorFromLine(line);
                if (color) {
                    const swatch = document.createElement('div');
                    swatch.className = 'swatch';
                    swatch.style.backgroundColor = color;
                    swatch.title = `Click to copy: ${color}`; // Tooltip
                    
                    // Add click-to-copy functionality
                    swatch.addEventListener('click', () => {
                        navigator.clipboard.writeText(color).then(() => {
                            // Optional: provide user feedback
                            swatch.style.border = '1px solid var(--accent)';
                            setTimeout(() => {
                                swatch.style.border = '1px solid var(--border)';
                            }, 500);
                        });
                    });
                    
                    fragment.appendChild(swatch);
                }
            });
            
            paletteContainer.appendChild(fragment);
        }

        // --- Initial Setup ---
        // Populate the textarea with default values and trigger the initial render
        inputArea.value = defaultColors.trim();
        updatePalette();

        // Add an event listener to update the palette whenever the user types
        inputArea.addEventListener('input', updatePalette);
    </script>
</body>
</html>
