<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Color Viewer</title>
    <style>
        :root {
            --bg: #141415;
            --fg: #cdcdcd;
            --textarea-bg: #252530;
            --border: #606079;
            --accent: #aeaed1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            padding-top: 2rem; /* Give some space at the top */
            height: 100vh;
            box-sizing: border-box;
        }

        /* UPDATED: Container is now centered with a max-width */
        .container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            height: 90%; /* Use slightly less height to avoid page scroll */
            max-width: 550px; /* Set a max width for the whole tool */
            margin: 0 auto;    /* Center the container on the page */
        }

        .panel {
            height: 100%;
            background-color: var(--textarea-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        #color-input-panel {
            width: 23%;
        }

        #color-input {
            width: 100%;
            height: 100%;
            color: var(--fg);
            resize: none;
            border: none;
            background: none;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 1rem;
            line-height: 1.8;
            padding: 1rem;
            box-sizing: border-box;
        }

        #color-input:focus {
            outline: none;
        }

        #color-input-panel:focus-within {
             outline: none;
             border-color: var(--accent);
             box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
        }

        #output {
            width: 60%;
            padding: 1rem;
            box-sizing: border-box;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 1rem;
            line-height: 1.8;
            overflow: auto;
        }
        
        .output-line {
            display: flex;
            align-items: center;
            min-height: 1.8em;
            padding: 0 4px;
            border-radius: 4px;
        }

        .output-line.clickable {
            cursor: pointer;
        }
        
        .output-line.clickable:hover {
            background-color: color-mix(in srgb, var(--border) 40%, transparent);
        }

        .swatch {
            width: 1.2em;
            height: 1.2em;
            border-radius: 4px;
            border: 1px solid var(--border);
            margin-right: 0.5rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel" id="color-input-panel">
             <textarea id="color-input" spellcheck="false"></textarea>
        </div>
        <div class="panel" id="output"></div>
    </div>

    <script>
        const inputArea = document.getElementById('color-input');
        const outputArea = document.getElementById('output');
        const tempStyleChecker = document.createElement('div').style;

        // UPDATED: Defaults are now clean
        const defaultColors = `
#e0a363
#6e94b2
#b4d4cf
#cdcdcd
#606079
#aeaed1
#d8647e
#c48282
#141415
#252530
        `;
        
        function getValidColor(str) {
            tempStyleChecker.color = '';
            tempStyleChecker.color = str;
            return tempStyleChecker.color === '' ? null : tempStyleChecker.color;
        }

        function parseColorFromLine(line) {
            if (!line.trim()) return null;
            const colorMatch = line.match(/(#[0-9a-f]{3,8}|(rgba?|hsla?)\(.*\)|[a-z]{3,})/i);
            
            if (colorMatch) {
                const potentialColor = colorMatch[0];
                const validColor = getValidColor(potentialColor);
                if (validColor) {
                    return validColor;
                }
            }
            return null;
        }

        function updatePreview() {
            outputArea.innerHTML = '';
            const lines = inputArea.value.split('\n');
            const fragment = document.createDocumentFragment();

            lines.forEach(line => {
                const color = parseColorFromLine(line);
                
                const lineDiv = document.createElement('div');
                lineDiv.className = 'output-line';
                
                if (color) {
                    lineDiv.classList.add('clickable');
                    lineDiv.title = `Click to copy: ${color}`;
                    
                    const swatch = document.createElement('span');
                    swatch.className = 'swatch';
                    swatch.style.backgroundColor = color;
                    
                    const code = document.createElement('span');
                    code.textContent = color;
                    
                    lineDiv.appendChild(swatch);
                    lineDiv.appendChild(code);
                    
                    lineDiv.addEventListener('click', () => {
                        navigator.clipboard.writeText(color);
                    });
                } else {
                    lineDiv.innerHTML = '&nbsp;';
                }
                fragment.appendChild(lineDiv);
            });
            
            outputArea.appendChild(fragment);
        }

        inputArea.value = defaultColors.trim();
        updatePreview();
        inputArea.addEventListener('input', updatePreview);
    </script>
</body>
</html>
